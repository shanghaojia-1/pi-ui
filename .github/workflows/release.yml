name: Release builds

# 推送 release 分支时自动打包 macOS / Windows 的可执行 zip 压缩包，
# 并发布到 GitHub Releases（continuous 预发布页）供用户直接下载。
# 也可以在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS (x64 + arm64 zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck + electron-vite production build
      - run: npm run build

      # 不签名（identity: null），zip 目标来自 package.json 的 mac.target。
      # --publish never：CI 环境下 electron-builder 会隐式触发发布并索要
      # GH_TOKEN，上传统一由 publish job 用 gh CLI 完成。
      - name: Package macOS zips
        run: npx electron-builder --mac zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: pi-studio-mac
          path: release/*.zip
          if-no-files-found: error

  build-win:
    name: Windows (x64 zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # CLI 指定 zip 目标：electron-builder 按 package.json 的 artifactName
      # 产出 Pi-Studio-<version>-win-x64.zip；--publish never 同上
      - name: Package Windows zip
        shell: bash
        run: npx electron-builder --win zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: pi-studio-win
          path: release/*.zip
          if-no-files-found: error

  build-linux:
    name: Linux (x64 AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # AppImage 单文件可执行（chmod +x 后直接运行）；AppImage 目标只能
      # 在 Linux runner 上构建，产物命名来自 package.json 的 appImage 段；
      # --publish never 同上
      - name: Package Linux AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: pi-studio-linux
          path: release/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish continuous release
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 每次推送 release 分支都刷新同一个 prerelease 下载页
      # （continuous-release），附件同名时覆盖更新。
      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="continuous-${GITHUB_REF_NAME}"
          NOTES=$'Auto-built from the release branch — download the file for your platform and run it.\n自动构建于 release 分支：macOS 选 *-mac-arm64.zip（Apple Silicon）或 *-mac-x64.zip（Intel）；Windows 选 *-win-x64.zip；Linux 选 *-linux-x64.AppImage（chmod +x 后直接运行）。'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.AppImage --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.AppImage \
              --title "Continuous build ($(date -u +%Y-%m-%d))" \
              --prerelease \
              --notes "$NOTES"
          fi
